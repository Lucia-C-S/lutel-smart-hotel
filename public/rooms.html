<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rooms - P2 Smart Hotel</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body data-page="rooms">
    <nav>
      <a href="/rooms.html">Rooms</a>
      <a href="/devices.html">Devices</a>
      <a href="/alarms.html">Alarms</a>
    </nav>
    <main>
      <h1>Rooms</h1>
      <p id="message" hidden></p>
      <section>
        <h2 id="room-list-heading">Room list</h2>
        <button id="refresh" type="button">Refresh</button>
        <ul id="rooms-list"><li>Loading rooms…</li></ul>
      </section>
      <section>
        <h2 id="create-room-heading">Create a room</h2>
        <form id="room-form">
          <label for="room-id">Room ID</label>
          <input id="room-id" name="id" required placeholder="203">
          <label for="room-floor">Floor</label>
          <input id="room-floor" name="floor" type="number" step="1" required placeholder="2">
          <label for="room-type">Type</label>
          <input id="room-type" name="type" required placeholder="double">
          <button type="submit">Create room</button>
        </form>
      </section>
    </main>
  </body>
</html>
