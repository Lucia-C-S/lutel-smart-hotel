<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Devices - P2 Smart Hotel</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body data-page="devices">
    <nav>
      <a href="/index.html">Main page</a>
      <a href="/rooms.html">Rooms</a>
      <a href="/devices.html">Devices</a>
      <a href="/alarms.html">Alarms</a>
    </nav>
    <main>
      <h1>Devices</h1>
      <p id="message" hidden></p>
      <section>
        <h2 id="device-list-heading">Device list</h2>
        <button id="refresh" type="button">Refresh</button>
        <ul id="devices-list"><li>Loading devices...</li></ul>
      </section>
      <section>
        <h2 id="create-device-heading">Create a device</h2>
        <form id="devices-form">
          <label for="device-id">Device ID</label>
          <input id="device" name="id" step="1" required placeholder="dev-001">
          <label for="room-id">Room ID</label>
          <input id="room-id" name="roomId" type="number" required placeholder="203">
          <label for="device-type">Type</label>
          <input id="device-type" name="type" required placeholder="temperature">
          <label for="device-label">Label</label>
          <input id="device-label" name="label" required placeholder="Temperaturesensor203">
          <button type="submit">Create device</button>
        </form>
      </section>
    </main>
  </body>
</html>
