<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alarms - P2 Smart Hotel</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body data-page="alarms">
    <nav>
      <a href="/index.html">Main page</a>
      <a href="/rooms.html">Rooms</a>
      <a href="/devices.html">Devices</a>
      <a href="/alarms.html">Alarms</a>
    </nav>
    <main>
      <h1>Alarms</h1>
      <p id="message" hidden></p>
      <section>
        <div class="alarms-heading">
          <div>
            <h2 id="alarm-list-heading">Alarm history</h2>
            <p>Alarms are generated automatically when a device reading crosses a threshold.</p>
          </div>
          <button id="refresh" type="button">Refresh</button>
        </div>
        <div class="table-container">
          <table class="alarms-table">
            <thead>
              <tr>
                <th scope="col">Status</th>
                <th scope="col">Alarm</th>
                <th scope="col">Device</th>
                <th scope="col">Room</th>
                <th scope="col">Triggered</th>
                <th scope="col">Action</th>
              </tr>
            </thead>
            <tbody id="alarms-table-body">
              <tr><td colspan="6">Loading alarms...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
